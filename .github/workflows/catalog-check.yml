name: Catalogue check

on:
  push:
  pull_request:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue
        run: python scripts/validate_catalog.py
      - name: Check source links
        run: python scripts/check_links.py
